<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="../assets/brand/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebTunnel | Enrique Garcia</title>
  <!-- Added FontAwesome for the return icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* SMOOTH TRANSITION BASE */
    html { background-color: #0b0d12; }
    
    :root {
      --bg: #0b0d12;
      --panel: #14171f;
      --border: #2a2f3a;
      --accent: #00a3e0; /* SpaceX Blue */
      --accent-dim: rgba(0, 163, 224, 0.2);
      --text: #e0e0e0;
      --text-dim: #70757f;
      --success: #00ff9d;
      --warning: #ffb700;
      --danger: #ff3366;
      --font-stack: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif;
      --mono-stack: 'Consolas', 'Monaco', 'Courier New', monospace;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-stack);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      will-change: opacity, transform; /* Optimize animation */
    }

    /* HEADER */
    header {
      height: 50px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    /* Mission Control Return Button */
    .mission-return-btn {
      background: rgba(255, 183, 0, 0.1); /* Warning tint */
      border: 1px solid var(--warning);
      color: var(--warning);
      font-family: var(--mono-stack);
      font-size: 10px;
      padding: 6px 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-right: 20px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      outline: none;
    }

    .mission-return-btn:hover {
      background: var(--warning);
      color: #0b0d12;
      box-shadow: 0 0 15px rgba(255, 183, 0, 0.4);
      transform: translateX(-2px);
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .separator {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin-right: 20px;
    }

    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* MAIN LAYOUT */
    .mission-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* VIEWPORT */
    .viewport {
      flex: 1;
      position: relative;
      background: #050608;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      image-rendering: pixelated; 
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      width: 100%;
      height: 100%;
      object-fit: contain; 
      background: #000;
    }

    .overlay-hud {
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: var(--mono-stack);
      font-size: 11px;
      color: var(--accent);
      pointer-events: none;
      text-shadow: 0 0 5px rgba(0, 163, 224, 0.5);
      background: rgba(11, 13, 18, 0.85);
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      width: 200px;
      margin-bottom: 4px;
    }
    
    .hud-label { color: var(--text-dim); }
    .hud-val { font-weight: bold; }

    /* SIDEBAR */
    .controls-panel {
      width: 340px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 10;
    }

    .panel-section {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
    }

    .panel-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-bottom: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .panel-title::before {
      content: '';
      display: block;
      width: 3px;
      height: 12px;
      background: var(--accent);
    }

    /* CONTROLS UI */
    .control-group {
      margin-bottom: 12px;
    }

    label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 6px;
      font-family: var(--mono-stack);
      color: var(--text);
    }
    
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    input[type="number"], input[type="text"] {
      background: #0b0d12;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono-stack);
      padding: 4px 8px;
      width: 60px;
      font-size: 11px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #2a2f3a;
      border-radius: 2px;
      appearance: none;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      background: var(--text);
      border: 2px solid var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 163, 224, 0.3);
      transition: transform 0.1s;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: var(--accent);
    }

    select {
      width: 100%;
      background: #0b0d12;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      font-family: var(--mono-stack);
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      outline: none;
    }
    
    select:focus {
      border-color: var(--accent);
    }

    button {
      background: rgba(0, 163, 224, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      font-family: var(--mono-stack);
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      background: var(--accent);
      color: #0b0d12;
      box-shadow: 0 0 20px rgba(0, 163, 224, 0.4);
    }

    button.secondary {
      border-color: var(--border);
      color: var(--text-dim);
      background: transparent;
    }
    
    button.secondary:hover {
      border-color: var(--text);
      color: var(--text);
      background: rgba(255,255,255,0.05);
      box-shadow: none;
    }
    
    button.danger {
      border-color: #ff3366;
      color: #ff3366;
      background: rgba(255, 51, 102, 0.05);
    }
    
    button.danger:hover {
      background: #ff3366;
      color: white;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 8px;
      background: rgba(255,255,255,0.02);
      border-radius: 4px;
      transition: background 0.2s;
    }
    
    .checkbox-wrapper:hover {
      background: rgba(255,255,255,0.05);
    }
    
    .file-upload-btn {
      display: block;
      text-align: center;
      padding: 12px;
      border: 1px dashed var(--border);
      color: var(--text-dim);
      font-size: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
      background: rgba(0,0,0,0.2);
    }

    .file-upload-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 163, 224, 0.05);
    }

    /* TELEMETRY GRAPH */
    .telemetry-graph {
      width: 100%;
      height: 100px;
      background: #050608;
      border: 1px solid var(--border);
      margin-top: 10px;
      image-rendering: auto; 
    }
    
    .value-readout {
      font-family: var(--mono-stack);
      color: var(--accent);
      font-size: 12px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <!-- 
         UPDATED RETURN MECHANISM:
         1. Links to ../webtunnel-cfd.html (Up one level to Project Overview Page)
         2. onclick triggers smoothExit() animation
      -->
      <button onclick="smoothExit(event, '../webtunnel-cfd.html')" class="mission-return-btn">
        <i class="fas fa-chevron-left"></i> RETURN
      </button>
      <div class="separator"></div>
      
      <h1><div class="status-indicator"></div> WebTunnel <span style="opacity:0.5; font-weight:400; font-size: 0.8em; margin-left: 10px;"> </span></h1>
    </div>

    <div style="font-family: var(--mono-stack); font-size: 11px; color: var(--text-dim); display:flex; gap: 20px;">
      <span>GRID: <span style="color:var(--text)">200x200</span></span>
      <span>MODE: <span style="color:var(--text)">AERO-ELASTIC</span></span>
      <span>SYS.VER.4.0.0</span>
    </div>
  </header>

  <div class="mission-container">
    <div class="viewport">
      <div class="overlay-hud">
        <div class="hud-row"><span class="hud-label">SIM TIME</span> <span class="hud-val" id="hud-time">0.00 s</span></div>
        <div class="hud-row"><span class="hud-label">FPS</span> <span class="hud-val" id="hud-fps">60</span></div>
        <div class="hud-row"><span class="hud-label">REYNOLDS No.</span> <span class="hud-val" id="hud-re" style="color:var(--warning)">INF</span></div>
        <!-- Added back hud-max-u to prevent null error -->
        <div class="hud-row"><span class="hud-label">MAX VELOCITY</span> <span class="hud-val" id="hud-max-u">0.0 m/s</span></div>
        <div class="hud-row" style="border-top:1px solid #333; margin-top:4px; padding-top:4px;"><span class="hud-label">EST. LIFT (CL)</span> <span class="hud-val" id="hud-lift" style="color:var(--success)">0.000</span></div>
        <div class="hud-row"><span class="hud-label">EST. DRAG (CD)</span> <span class="hud-val" id="hud-drag" style="color:var(--danger)">0.000</span></div>
        <div class="hud-row"><span class="hud-label">L/D RATIO</span> <span class="hud-val" id="hud-ld">0.0</span></div>
      </div>
      <canvas id="simCanvas"></canvas>
    </div>

    <aside class="controls-panel">
      
      <!-- AERODYNAMICS -->
      <div class="panel-section">
        <div class="panel-title">Aerodynamic Controls</div>
        
        <div class="control-group">
          <label>NACA PROFILE (4-Digit)</label>
          <div class="input-row">
            <input type="text" id="nacaDigits" value="2412" maxlength="4">
            <button onclick="updateGeometry()" style="margin:0; flex:1">GENERATE</button>
          </div>
        </div>

        <div class="control-group">
          <label><span>ANGLE OF ATTACK (AoA)</span> <span id="val-aoa" style="color:var(--warning)">0°</span></label>
          <input type="range" id="aoaSlider" min="-20" max="40" step="1" value="0" oninput="updateGeometry(true)">
        </div>

        <div class="control-group">
             <button onclick="generateCylinder()" class="secondary">RESET TO CYLINDER</button>
        </div>
      </div>

      <!-- PHYSICS PARAMETERS -->
      <div class="panel-section">
        <div class="panel-title">Flow Physics</div>
        
        <div class="control-group">
          <label><span>VISCOSITY (ν)</span> <span id="val-visc" style="color:var(--accent)">0.00000</span></label>
          <input type="range" id="viscSlider" min="0" max="0.002" step="0.00001" value="0.0000">
        </div>

        <div class="control-group">
          <label><span>VORTICITY CONFINEMENT</span> <span id="val-vort">5.0</span></label>
          <input type="range" id="vortSlider" min="0" max="20" step="0.1" value="5.0">
        </div>

        <div class="control-group">
          <label><span>FLOW SPEED</span> <span id="val-dt">0.10</span></label>
          <input type="range" id="dtSlider" min="0.05" max="0.4" step="0.01" value="0.1">
        </div>
        
        <button id="btn-pause" onclick="togglePause()" class="secondary">PAUSE SIMULATION</button>
      </div>

      <!-- VISUALIZATION -->
      <div class="panel-section">
        <div class="panel-title">Visualization</div>
        <div class="control-group">
          <label>DATA CHANNEL</label>
          <select id="viewMode">
            <option value="curl">VORTICITY (CURL)</option>
            <option value="velocity">VELOCITY MAGNITUDE</option>
            <option value="density" selected>SMOKE DENSITY</option>
            <option value="pressure">PRESSURE GRADIENT</option>
            <option value="streamlines">PARTICLE STREAMLINES</option>
          </select>
        </div>
        
        <label class="checkbox-wrapper">
          <input type="checkbox" id="toggleWind" checked> 
          <span>WIND TUNNEL INJECTION</span>
        </label>
        
        <button onclick="resetSim()" class="danger" style="margin-top:10px;">FLUSH SYSTEM / RESET</button>
      </div>

      <!-- TELEMETRY -->
      <div class="panel-section">
        <div class="panel-title">Force Telemetry</div>
        <label>
            <span style="color:var(--success)">LIFT</span> vs 
            <span style="color:var(--danger)">DRAG</span>
        </label>
        <canvas id="graphForces" class="telemetry-graph" width="300" height="100"></canvas>
      </div>
      
       <!-- GEOMETRY -->
      <div class="panel-section" style="border:none">
        <div class="panel-title">Custom Import</div>
        <input type="file" id="imageLoader" accept="image/*" style="display:none">
        <label for="imageLoader" class="file-upload-btn">
          [ UPLOAD OBSTACLE IMAGE ]
        </label>
      </div>

    </aside>
  </div>

<script>
/**
 * WEBTUNNEL V4.0 - ADVANCED AERO SOLVER
 * Features: 
 * - Parametric NACA Generator with Angle of Attack
 * - Real-time Lift/Drag Integration
 * - Vorticity Confinement for turbulence preservation
 */

// --- SAFETY CHECK ---
if (window.simLoopId) cancelAnimationFrame(window.simLoopId);

// --- CONFIGURATION ---
var N = 200;            
var ITER = 15; // Higher iterations for better pressure solution
var PARTICLE_COUNT = 4000;

var CONFIG = {
  diffusion: 0.0000,
  viscosity: 0.0000, 
  dt: 0.1,
  wind: true,
  paused: false,
  vorticity: 5.0,
  aoa: 0
};

// --- GLOBALS ---
var size = (N + 2) * (N + 2);

// Fluid Arrays 
var u = new Float32Array(size);
var v = new Float32Array(size);
var u_prev = new Float32Array(size);
var v_prev = new Float32Array(size);
var dens = new Float32Array(size);
var dens_prev = new Float32Array(size);
var press = new Float32Array(size);
var curl = new Float32Array(size);

// Force tracking
var liftHistory = new Array(100).fill(0);
var dragHistory = new Array(100).fill(0);

// Particles
var particles = new Float32Array(PARTICLE_COUNT * 2); 
for(let i=0; i<PARTICLE_COUNT; i++) {
    particles[i*2] = Math.random() * N;
    particles[i*2+1] = Math.random() * N;
}

// Obstacle Array
var obstacle = new Uint8Array(size);

// Canvas
var canvas = document.getElementById('simCanvas');
canvas.width = N;
canvas.height = N;
var ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });
var imgData = ctx.createImageData(N, N); 

// Telemetry Canvas
var tCanvas = document.getElementById('graphForces');
var tCtx = tCanvas.getContext('2d');

// --- INITIALIZATION ---
function init() {
  updateGeometry(); 
}

function resetSim() {
  u.fill(0); v.fill(0);
  u_prev.fill(0); v_prev.fill(0);
  dens.fill(0); dens_prev.fill(0);
  press.fill(0);
  // Respawn particles
  for(let i=0; i<PARTICLE_COUNT; i++) {
      particles[i*2] = Math.random() * N;
      particles[i*2+1] = Math.random() * N;
  }
}

function togglePause() {
    CONFIG.paused = !CONFIG.paused;
    const btn = document.getElementById('btn-pause');
    if(CONFIG.paused) {
        btn.innerText = "RESUME";
        btn.style.color = "#00ff9d";
    } else {
        btn.innerText = "PAUSE SIMULATION";
        btn.style.color = "";
    }
}

// --- ADVANCED GEOMETRY ENGINE ---

function updateGeometry(onlyRotation = false) {
    const code = document.getElementById('nacaDigits').value || "2412";
    CONFIG.aoa = parseFloat(document.getElementById('aoaSlider').value);
    document.getElementById('val-aoa').innerText = CONFIG.aoa + "°";
    
    // Only reset flow if shape changes drastically, but for rotation we usually assume new simulation state
    if (!onlyRotation) resetSim();
    
    generateNACA(code, CONFIG.aoa);
}

function generateNACA(code, aoaDeg) {
    obstacle.fill(0);
    
    // Parse 4 digits
    // Example 2412: M=0.02, P=0.4, T=0.12
    let M = parseInt(code[0]) / 100.0;
    let P = parseInt(code[1]) / 10.0;
    let T = parseInt(code.substring(2)) / 100.0;
    
    const chord = N * 0.6;
    const cx = N * 0.2; // Leading edge X
    const cy = N * 0.5; // Center Y
    
    const rad = -aoaDeg * (Math.PI / 180); // Negative for math coord system vs screen
    const cosA = Math.cos(rad);
    const sinA = Math.sin(rad);

    // Rasterize
    for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
            
            // Transform grid point to airfoil local space
            let tx = i - cx;
            let ty = j - cy;
            
            // Rotate back to align with 0-angle airfoil for testing
            // We rotate point backwards to check against axis-aligned airfoil
            let rx = tx * cosA - ty * sinA;
            let ry = tx * sinA + ty * cosA;
            
            // Normalize x along chord
            let x = rx / chord;
            
            if (x >= 0 && x <= 1) {
                // Camber line Yc
                let yc = 0;
                let dyc_dx = 0;
                
                if (x < P) {
                    yc = (M / (P*P)) * (2*P*x - x*x);
                } else {
                    yc = (M / ((1-P)*(1-P))) * ((1 - 2*P) + 2*P*x - x*x);
                }
                
                // Thickness distribution
                let yt = 5 * T * (0.2969*Math.sqrt(x) - 0.1260*x - 0.3516*x*x + 0.2843*x*x*x - 0.1015*x*x*x*x);
                
                // For simplified rasterization, just check thickness around camber line
                // Ideally we calculate surface normals, but this is sufficient for grid
                let upper = yc + yt;
                let lower = yc - yt;
                
                // Normalize ry to chord space
                let y_norm = ry / chord;
                
                // Check if point is inside
                // Note: NACA thickness is perpendicular to camber, but vertical approx is okay for thin airfoils
                if (y_norm <= upper && y_norm >= lower) {
                    obstacle[IX(i, j)] = 1;
                }
            }
        }
    }
}

function generateCylinder() {
  obstacle.fill(0);
  const cx = N / 4; 
  const cy = N / 2;
  const r = N / 10;
  for (let j = 0; j < N + 2; j++) {
    for (let i = 0; i < N + 2; i++) {
      let dx = i - cx;
      let dy = j - cy;
      if (Math.sqrt(dx*dx + dy*dy) < r) obstacle[IX(i, j)] = 1;
    }
  }
}

// --- IMAGE IMPORT ---
document.getElementById('imageLoader').addEventListener('change', handleImage, false);

function handleImage(e) {
  const reader = new FileReader();
  reader.onload = function(event) {
    const img = new Image();
    img.onload = function() {
      const tempC = document.createElement('canvas');
      tempC.width = N;
      tempC.height = N;
      const tCtx = tempC.getContext('2d');
      tCtx.fillStyle = "white";
      tCtx.fillRect(0,0,N,N);
      tCtx.drawImage(img, 0, 0, N, N);
      const data = tCtx.getImageData(0, 0, N, N).data;
      obstacle.fill(0);
      for (let j = 0; j < N; j++) {
        for (let i = 0; i < N; i++) {
          const p = (j * N + i) * 4;
          const brightness = (data[p] + data[p+1] + data[p+2]) / 3;
          if (brightness < 128) obstacle[IX(i+1, j+1)] = 1;
        }
      }
      resetSim();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(e.target.files[0]);
}

// --- SOLVER CORE ---
function IX(x, y) {
  x = x < 0 ? 0 : (x > N + 1 ? N + 1 : x);
  y = y < 0 ? 0 : (y > N + 1 ? N + 1 : y);
  return x + (N + 2) * y;
}

function enforce_obstacles(u, v, dens) {
  for (let i = 0; i < size; i++) {
    if (obstacle[i]) {
      u[i] = 0; v[i] = 0; dens[i] = 0;
    }
  }
}

function set_bnd(b, x) {
  for (let i = 1; i <= N; i++) {
    x[IX(0,i)] = b===1 ? -x[IX(1,i)] : x[IX(1,i)];
    x[IX(N+1,i)] = b===1 ? -x[IX(N,i)] : x[IX(N,i)];
    x[IX(i,0)] = b===2 ? -x[IX(i,1)] : x[IX(i,1)];
    x[IX(i,N+1)] = b===2 ? -x[IX(i,N)] : x[IX(i,N)];
  }
  x[IX(0,0)] = 0.5 * (x[IX(1,0)] + x[IX(0,1)]);
  x[IX(0,N+1)] = 0.5 * (x[IX(1,N+1)] + x[IX(0,N)]);
  x[IX(N+1,0)] = 0.5 * (x[IX(N,0)] + x[IX(N+1,1)]);
  x[IX(N+1,N+1)] = 0.5 * (x[IX(N,N+1)] + x[IX(N+1,N)]);
}

function lin_solve(b, x, x0, a, c) {
  let cRecip = 1.0 / c;
  for (let k = 0; k < ITER; k++) {
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacle[IX(i,j)]) continue;
        x[IX(i, j)] = (x0[IX(i, j)] +
            a * (x[IX(i-1,j)] + x[IX(i+1,j)] +
                 x[IX(i,j-1)] + x[IX(i,j+1)])) * cRecip;
      }
    }
    set_bnd(b, x);
  }
}

function diffuse(b, x, x0, diff, dt) {
  let a = dt * diff * (N - 2) * (N - 2);
  lin_solve(b, x, x0, a, 1 + 4 * a);
}

function advect(b, d, d0, u, v, dt) {
  let dt0 = dt * (N - 2);
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacle[IX(i,j)]) continue;
      
      let x = i - dt0 * u[IX(i,j)];
      let y = j - dt0 * v[IX(i,j)];
      
      if (x < .5) x = .5; if (x > N+.5) x = N+.5;
      if (y < .5) y = .5; if (y > N+.5) y = N+.5;
      
      let i0 = Math.floor(x); let i1 = i0 + 1;
      let j0 = Math.floor(y); let j1 = j0 + 1;
      
      let s1 = x - i0; let s0 = 1 - s1;
      let t1 = y - j0; let t0 = 1 - t1;
      
      d[IX(i,j)] =
        s0 * (t0*d0[IX(i0,j0)] + t1*d0[IX(i0,j1)]) +
        s1 * (t0*d0[IX(i1,j0)] + t1*d0[IX(i1,j1)]);
    }
  }
  set_bnd(b, d);
}

function project(u, v, p, div) {
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacle[IX(i,j)]) {
        p[IX(i,j)] = div[IX(i,j)] = 0;
        continue;
      }
      div[IX(i,j)] = -0.5 * (u[IX(i+1,j)] - u[IX(i-1,j)] +
                             v[IX(i,j+1)] - v[IX(i,j-1)]) / N;
      p[IX(i,j)] = 0;
    }
  }
  set_bnd(0, div); set_bnd(0, p);
  lin_solve(0, p, div, 1, 4);
  
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacle[IX(i,j)]) continue;
      u[IX(i,j)] -= 0.5 * N * (p[IX(i+1,j)] - p[IX(i-1,j)]);
      v[IX(i,j)] -= 0.5 * N * (p[IX(i,j+1)] - p[IX(i,j-1)]);
    }
  }
  press.set(p); 
}

// --- VORTICITY CONFINEMENT ---
function vorticity_confinement(u, v, dt) {
  // Calculate Curl
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
        curl[IX(i,j)] = (v[IX(i+1,j)] - v[IX(i-1,j)]) * 0.5 -
                        (u[IX(i,j+1)] - u[IX(i,j-1)]) * 0.5;
    }
  }
  
  // Calculate confinement force
  // F = epsilon * h * (grad(|omega|) x omega) / |grad(|omega|)|
  for (let j = 2; j < N; j++) {
    for (let i = 2; i < N; i++) {
       if (obstacle[IX(i,j)]) continue;
       
       let c = curl[IX(i,j)];
       let abs_c_r = Math.abs(curl[IX(i+1,j)]);
       let abs_c_l = Math.abs(curl[IX(i-1,j)]);
       let abs_c_t = Math.abs(curl[IX(i,j+1)]);
       let abs_c_b = Math.abs(curl[IX(i,j-1)]);
       
       // Gradient of magnitude of curl
       let dx = (abs_c_r - abs_c_l) * 0.5;
       let dy = (abs_c_t - abs_c_b) * 0.5;
       let len = Math.sqrt(dx*dx + dy*dy) + 1e-5;
       
       // Normalized direction
       dx /= len;
       dy /= len;
       
       // Force direction is (dy, -dx) cross curl magnitude?
       // Actually in 2D it's (psi_x, psi_y) where psi = normalize(grad|omega|)
       // Force = epsilon * (psi x omega)
       // 2D cross product: (a,b) x k = (b*k, -a*k)
       
       let fx = dy * c;
       let fy = -dx * c;
       
       u[IX(i,j)] += fx * CONFIG.vorticity * dt;
       v[IX(i,j)] += fy * CONFIG.vorticity * dt;
    }
  }
}

// --- FORCE CALCULATION ---
function calculateForces() {
    let Fx = 0;
    let Fy = 0;
    
    // Simple pressure integration over obstacle boundary
    // For every fluid cell adjacent to obstacle, add pressure force normal to boundary
    // Normal points INTO fluid. Force on obstacle is opposite.
    
    for (let j = 1; j <= N; j++) {
        for (let i = 1; i <= N; i++) {
            if (obstacle[IX(i,j)]) {
                // If I am obstacle
                
                // Check Right neighbor (is it fluid?)
                if (!obstacle[IX(i+1, j)]) {
                    // Fluid pressure pushes Left on me
                    Fx -= press[IX(i+1, j)];
                }
                // Check Left neighbor
                if (!obstacle[IX(i-1, j)]) {
                    // Fluid pressure pushes Right on me
                    Fx += press[IX(i-1, j)];
                }
                // Check Top neighbor
                if (!obstacle[IX(i, j+1)]) {
                    // Fluid pressure pushes Down
                    Fy -= press[IX(i, j+1)];
                }
                // Check Bottom neighbor
                if (!obstacle[IX(i, j-1)]) {
                    // Fluid pressure pushes Up
                    Fy += press[IX(i, j-1)];
                }
            }
        }
    }
    
    // Scale for display (Empirical)
    let lift = Fy * 10;
    let drag = Math.abs(Fx) * 10;
    
    // Update DOM
    document.getElementById('hud-lift').innerText = lift.toFixed(3);
    document.getElementById('hud-drag').innerText = drag.toFixed(3);
    
    let ratio = drag > 0.001 ? (lift/drag) : 0;
    document.getElementById('hud-ld').innerText = ratio.toFixed(2);
    
    updateTelemetry(lift, drag);
}

// MAIN STEP
function step() {
  if (CONFIG.paused) return;

  if (CONFIG.wind) {
    for (let j = 1; j <= N; j++) {
      u[IX(1, j)] = 5.0; 
      dens[IX(1, j)] = (j % 12 > 1 && j % 12 < 3) ? 255 : 0; 
    }
  }

  diffuse(1, u_prev, u, CONFIG.viscosity, CONFIG.dt);
  diffuse(2, v_prev, v, CONFIG.viscosity, CONFIG.dt);
  
  // Apply Vorticity Confinement before projection
  vorticity_confinement(u, v, CONFIG.dt);
  
  project(u_prev, v_prev, u, v);
  advect(1, u, u_prev, u_prev, v_prev, CONFIG.dt);
  advect(2, v, v_prev, u_prev, v_prev, CONFIG.dt);
  project(u, v, u_prev, v_prev);
  
  diffuse(0, dens_prev, dens, CONFIG.diffusion, CONFIG.dt);
  advect(0, dens, dens_prev, u, v, CONFIG.dt);
  
  enforce_obstacles(u, v, dens);

  // Advect Particles
  for(let i=0; i<PARTICLE_COUNT; i++) {
      let px = particles[i*2];
      let py = particles[i*2+1];
      
      let ix = Math.floor(px);
      let iy = Math.floor(py);
      
      if(px < 1) px = N-1; if(px > N-1) px = 1;
      if(py < 1) py = N-1; if(py > N-1) py = 1;
      
      let idx = IX(ix, iy);
      let vx = u[idx];
      let vy = v[idx];
      
      px += vx * CONFIG.dt * (N/10); 
      py += vy * CONFIG.dt * (N/10);
      
      if (obstacle[IX(Math.floor(px), Math.floor(py))]) {
          px = 1; py = Math.random() * N; 
      }
      
      particles[i*2] = px;
      particles[i*2+1] = py;
  }
  
  // Calc Forces every few frames to save cycles? 
  // Fast enough to do every frame on this grid
  calculateForces();
}

// --- COLOR MAPS ---

function getTurboColor(t) {
  t = Math.max(0, Math.min(1, t));
  const R = 34.61 + t * (1172.33 - t * (10793.56 - t * (33300.12 - t * (38394.49 - t * 14825.05))));
  const G = 23.31 + t * (557.33 + t * (1225.33 - t * (3574.96 - t * (1073.77 + t * 707.56))));
  const B = 27.2 + t * (3211.1 - t * (15327.97 - t * (27814 - t * (22569.18 - t * 6836.66))));
  return [Math.floor(R), Math.floor(G), Math.floor(B), 255];
}

function getCurlColor(val) {
  val = Math.max(-1, Math.min(1, val));
  if (val > 0) return [255, 255 - val*200, 255 - val*200, 255];
  return [255 + val*200, 255 + val*200, 255, 255];
}

function getCurl(i, j) {
  return (v[IX(i+1, j)] - v[IX(i-1, j)]) - (u[IX(i, j+1)] - u[IX(i, j-1)]);
}

// --- RENDERING ---
function render() {
  const mode = document.getElementById('viewMode').value;
  const pixels = imgData.data;
  let maxU = 0;
  
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const idx = IX(i + 1, j + 1);
      const pIdx = (j * N + i) * 4;

      if (obstacle[idx]) {
        pixels[pIdx] = 30; pixels[pIdx+1] = 33; pixels[pIdx+2] = 41; pixels[pIdx+3] = 255;
        continue;
      }

      const vx = u[idx];
      const vy = v[idx];
      const mag = Math.sqrt(vx*vx + vy*vy);
      if (mag > maxU) maxU = mag;

      if (mode === 'density') {
        const d = dens[idx];
        pixels[pIdx] = d * 0.1;
        pixels[pIdx+1] = d * 0.6;
        pixels[pIdx+2] = d * 0.9;
        pixels[pIdx+3] = 255;
      } 
      else if (mode === 'velocity') {
        const col = getTurboColor(mag * 0.15); 
        pixels[pIdx] = col[0]; pixels[pIdx+1] = col[1]; pixels[pIdx+2] = col[2]; pixels[pIdx+3] = 255;
      }
      else if (mode === 'pressure') {
        const p = press[idx];
        const col = getCurlColor(p * 20); 
        pixels[pIdx] = col[0]; pixels[pIdx+1] = col[1]; pixels[pIdx+2] = col[2]; pixels[pIdx+3] = 255;
      }
      else if (mode === 'curl') {
        const c = getCurl(i+1, j+1);
        const col = getCurlColor(c * 2); 
        pixels[pIdx] = col[0]; pixels[pIdx+1] = col[1]; pixels[pIdx+2] = col[2]; pixels[pIdx+3] = 255;
      }
      else if (mode === 'streamlines') {
          pixels[pIdx] = 10; pixels[pIdx+1] = 12; pixels[pIdx+2] = 18; pixels[pIdx+3] = 255;
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  if (mode === 'streamlines') {
      ctx.fillStyle = '#00ff9d'; 
      for(let i=0; i<PARTICLE_COUNT; i++) {
          let px = particles[i*2];
          let py = particles[i*2+1];
          if(px > 0 && px < N && py > 0 && py < N) {
              ctx.fillRect(px, py, 1, 1);
          }
      }
  }

  document.getElementById('hud-max-u').innerText = maxU.toFixed(2) + " m/s";
  
  if (CONFIG.viscosity <= 0.000001) {
      document.getElementById('hud-re').innerText = "INF (INVISCID)";
      document.getElementById('hud-re').style.color = "#ffb700";
  } else {
      let L = N * 0.6; 
      let re = (maxU * L) / (CONFIG.viscosity * 10000); 
      document.getElementById('hud-re').innerText = Math.floor(re).toLocaleString();
      document.getElementById('hud-re').style.color = "#00a3e0";
  }
}

// --- TELEMETRY GRAPH ---
function updateTelemetry(lift, drag) {
  liftHistory.push(lift);
  liftHistory.shift();
  dragHistory.push(drag);
  dragHistory.shift();

  tCtx.fillStyle = "#050608";
  tCtx.fillRect(0,0, tCanvas.width, tCanvas.height);
  
  // Baseline
  tCtx.strokeStyle = "#1a1f29";
  tCtx.lineWidth = 1;
  tCtx.beginPath();
  tCtx.moveTo(0, tCanvas.height/2); tCtx.lineTo(tCanvas.width, tCanvas.height/2);
  tCtx.stroke();

  // Lift (Green)
  tCtx.beginPath();
  tCtx.strokeStyle = "#00ff9d";
  tCtx.lineWidth = 2;
  const step = tCanvas.width / liftHistory.length;
  for(let i=0; i<liftHistory.length; i++) {
    // Center is 0
    const h = (liftHistory[i] / 50) * (tCanvas.height/2); 
    const y = (tCanvas.height/2) - h;
    if(i===0) tCtx.moveTo(i*step, y);
    else tCtx.lineTo(i*step, y);
  }
  tCtx.stroke();

  // Drag (Red/Pink)
  tCtx.beginPath();
  tCtx.strokeStyle = "#ff3366";
  tCtx.lineWidth = 2;
  for(let i=0; i<dragHistory.length; i++) {
    // Drag is usually positive
    const h = (dragHistory[i] / 50) * (tCanvas.height/2); 
    const y = (tCanvas.height/2) - h; 
    // Shift slightly so they don't overlap perfectly if equal
    if(i===0) tCtx.moveTo(i*step, y);
    else tCtx.lineTo(i*step, y);
  }
  tCtx.stroke();
}

// --- INTERACTION ---
let isMouseDown = false;
let lastX, lastY;

canvas.addEventListener("mousedown", (e) => {
  isMouseDown = true;
  const rect = canvas.getBoundingClientRect();
  const scaleX = N / rect.width;
  const scaleY = N / rect.height;
  lastX = (e.clientX - rect.left) * scaleX;
  lastY = (e.clientY - rect.top) * scaleY;
});
window.addEventListener("mouseup", () => isMouseDown = false);

canvas.addEventListener("mousemove", e => {
  if (!isMouseDown) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = N / rect.width;
  const scaleY = N / rect.height;
  let gridX = Math.floor((e.clientX - rect.left) * scaleX);
  let gridY = Math.floor((e.clientY - rect.top) * scaleY);
  
  if (gridX < 1 || gridX > N || gridY < 1 || gridY > N) return;
  
  dens[IX(gridX, gridY)] += 200;
  
  let currX = (e.clientX - rect.left) * scaleX;
  let currY = (e.clientY - rect.top) * scaleY;
  let forceX = (currX - lastX) * 5;
  let forceY = (currY - lastY) * 5;
  
  u[IX(gridX, gridY)] += forceX;
  v[IX(gridX, gridY)] += forceY;

  lastX = currX;
  lastY = currY;
});

// UI Listeners
document.getElementById('viscSlider').addEventListener('input', e => {
  CONFIG.viscosity = parseFloat(e.target.value);
  document.getElementById('val-visc').innerText = CONFIG.viscosity.toFixed(5);
});
document.getElementById('vortSlider').addEventListener('input', e => {
  CONFIG.vorticity = parseFloat(e.target.value);
  document.getElementById('val-vort').innerText = CONFIG.vorticity.toFixed(1);
});
document.getElementById('dtSlider').addEventListener('input', e => {
  CONFIG.dt = parseFloat(e.target.value);
  document.getElementById('val-dt').innerText = CONFIG.dt.toFixed(2);
});
document.getElementById('toggleWind').addEventListener('change', e => {
  CONFIG.wind = e.target.checked;
});

// LOOP
let time = 0;
let frameCount = 0;
let lastFpsTime = performance.now();

function loop() {
  step();
  render();
  
  if(!CONFIG.paused) time += CONFIG.dt;
  document.getElementById('hud-time').innerText = time.toFixed(2) + " s";
  
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('hud-fps').innerText = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }

  window.simLoopId = requestAnimationFrame(loop);
}

// Start
init();
loop();

// --- SMOOTH EXIT FUNCTION ---
function smoothExit(e, url) {
    e.preventDefault(); // Stop instant jump
    
    // 1. Animate out (Fade + slight shrink for depth)
    document.body.style.transition = "opacity 0.4s ease-in-out, transform 0.4s ease-in-out";
    document.body.style.opacity = "0";
    document.body.style.transform = "scale(0.98)"; 
    
    // 2. Wait for animation, then go
    setTimeout(() => {
        window.location.href = url;
    }, 400);
}
</script>
