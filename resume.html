<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrique Garcia | Resume</title>
    
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    
    <style>
        /* SMOOTH TRANSITION BASE */
        html { background-color: #000000; height: 100%; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #e2e8f0; 
            will-change: opacity, transform;
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%; 
            overflow: hidden; /* Prevents body scroll */
            display: flex; 
            flex-direction: column;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }

        nav { 
            flex: 0 0 auto; 
            z-index: 50; 
        }

        /* Optimized PDF Container */
        .pdf-container {
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
            min-height: 0;
            position: relative;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none;
            /* Prevents the resume from becoming too wide on ultra-wide screens */
            max-width: 1100px; 
        }
    </style>
  <link rel="stylesheet" href="css/site-theme.css">
</head>
<body class="antialiased">

    <nav class="w-full bg-black/80 backdrop-blur-md z-50 border-b border-white/10 flex-none">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="index.html" onclick="smoothExit(event, this.href)" class="flex items-center gap-3 group text-gray-400 hover:text-white transition-colors cursor-pointer">
                <i class="fas fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                <span class="font-mono font-bold tracking-wider uppercase text-sm">Return</span>
            </a>

            <div class="flex items-center gap-3 text-xs font-mono uppercase tracking-widest text-[#0067B1]">
                <span class="hidden md:inline font-semibold">Resume</span>
                <span class="w-1.5 h-1.5 rounded-full bg-[#E11D2E] animate-pulse" aria-hidden="true"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-[#FEC60A]" aria-hidden="true"></span>
            </div>
        </div>
    </nav>

    <div class="pdf-container">
        <iframe 
            src="docs/EG_Resume.pdf#view=FitH&navpanes=0&toolbar=1" 
            title="Enrique Garcia Resume">
        </iframe>
    </div>

      <script src="js/nav-persist.js?v=soft4"></script>
</body>
</html>
