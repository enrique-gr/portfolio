<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrique Garcia | Portfolio</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* SMOOTH TRANSITION BASE */
        html { background-color: #000000; height: 100%; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #e2e8f0; 
            will-change: opacity, transform;
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%; 
            overflow: hidden; /* CRITICAL: Prevents body scroll */
            display: flex; 
            flex-direction: column;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; }
        ::-webkit-scrollbar-thumb:hover { background: #71717a; }

        nav { 
            flex: 0 0 auto; 
            z-index: 50; 
        }

        /* PDF Container optimized for viewing */
        .pdf-container {
            flex: 1 1 auto;
            width: 100%;
            height: 100%;
            min-height: 0; 
            position: relative;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none;
            /* Wider max-width for portfolios to showcase project imagery */
            max-width: 1200px; 
        }
    </style>
</head>
<body class="antialiased">

    <nav class="w-full bg-[#050505]/80 backdrop-blur-xl border-b border-white/5 flex-none z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            
            <a href="index.html" onclick="smoothExit(event, this.href)" 
               class="flex items-center gap-2 group text-gray-400 hover:text-white transition-all duration-300 cursor-pointer">
                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center group-hover:bg-white/10 border border-white/5 group-hover:border-white/20 transition-all">
                    <i class="fas fa-arrow-left text-xs group-hover:-translate-x-0.5 transition-transform"></i>
                </div>
                <span class="font-mono font-bold tracking-widest uppercase text-xs">Return</span>
            </a>

            <div class="flex items-center gap-3 px-3 py-1.5 rounded-full bg-white/5 border border-white/5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
                <span class="text-[10px] font-mono text-gray-300 uppercase tracking-widest">Portfolio.pdf</span>
            </div>

        </div>
    </nav>

    <div class="pdf-container">
        <iframe 
            src="Enrique_Garcia_Portfolio.pdf#view=FitH&navpanes=0&toolbar=1" 
            title="Enrique Garcia Portfolio">
        </iframe>
    </div>

    <script>
        function smoothExit(e, url) {
            e.preventDefault(); 
            document.body.style.transition = "opacity 0.4s ease-in-out, transform 0.4s ease-in-out";
            document.body.style.opacity = "0";
            document.body.style.transform = "scale(0.98)"; 
            
            setTimeout(() => {
                window.location.href = url;
            }, 400);
        }
    </script>

</body>
</html>
